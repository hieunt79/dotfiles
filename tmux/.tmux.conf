# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

# Table of config
# 01_CUSTOM: custom config
# 02_TMUXAI: tmuxai generated config

# 01_CUSTOM: custom config
# -- Bindings -----------------------------------------------
#set -g prefix C-b
set-option -g prefix C-b
bind-key C-b send-prefix
set-option -g prefix2 C-a
bind-key C-a send-prefix
# Add to ~/.tmux.conf
bind ? list-keys
# Or for more details
bind / list-keys -a

# Reload config
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# F2: New window / Split windows
bind-key -n F2 new-window -c "#{pane_current_path}"
bind-key -n C-F2 split-window -h -c "#{pane_current_path}"   # Ctrl+F2: Vertical split (side-by-side)
bind-key -n S-F2 split-window -v -c "#{pane_current_path}"   # Shift+F2: Horizontal split (top/bottom)

# F3/F4: Navigate windows (Previous / Next)
bind-key -n M-Left previous-window
bind-key -n M-Right next-window
bind-key -n F3 previous-window
bind-key -n F4 next-window

# Alt + Left/Right: Alternative window navigation
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

# F5: Reload tmux configuration
bind-key -n F5 source-file ~/.tmux.conf \; display "tmux config reloaded!"

# F6: Detach session
bind-key -n F6 detach-client

# F7: Enter Copy/Scroll mode
bind-key -n F7 copy-mode

# F8: Rename the current window
bind-key -n F8 command-prompt -I "#W" "rename-window '%%'"

# Shift + Up/Down/Left/Right: Navigate between split panes
bind-key -n S-Up select-pane -U
bind-key -n S-Down select-pane -D
bind-key -n S-Left select-pane -L
bind-key -n S-Right select-pane -R

# 02_TMUXAI: tmuxai generated config

# -- Basic Settings ------------------------------------------
set -g escape-time 100
set -g history-limit 10000
set -g base-index 0
setw -g pane-base-index 0
set -g mouse off

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-left "#{session_name} "
set -g status-left-length 50
set -g status-right "#{host} %Y-%m-%d %H:%M"
set -g status-right-length 50

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'catppuccin/tmux'

# Theme configuration
set -g @catppuccin_flavour mocha

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Install TPM
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

